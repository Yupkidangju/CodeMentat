[workspace]
members = [
    "crates/mentat-core",
    "crates/mentat-repository",
    "crates/mentat-analysis",
    "crates/mentat-inference",
    "crates/mentat-inference-openai",
    "crates/mentat-inference-llama",
    "crates/mentat-persona",
    "crates/mentat-storage",
    "crates/mentat-platform",
    "crates/mentat-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Code Mentat Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mentat-core = { path = "crates/mentat-core" }
mentat-repository = { path = "crates/mentat-repository" }
mentat-analysis = { path = "crates/mentat-analysis" }
mentat-inference = { path = "crates/mentat-inference" }
mentat-inference-openai = { path = "crates/mentat-inference-openai" }
mentat-inference-llama = { path = "crates/mentat-inference-llama" }
mentat-persona = { path = "crates/mentat-persona" }
mentat-storage = { path = "crates/mentat-storage" }
mentat-platform = { path = "crates/mentat-platform" }

# Common Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
sha2 = "0.10"
dirs = "6.0"
rfd = "0.15"
eframe = "0.30"
egui = "0.30"
arboard = "3.4"
global-hotkey = "0.6"
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
tempfile = "3.17"
